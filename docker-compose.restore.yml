# =============================================================================
# The restore drill's own topology. Layered ON TOP of docker-compose.yml and never
# valid standalone.
#
# THREE SERVICES THAT EXIST ONLY FOR A DRILL, and the point of all three is that the
# restore happens somewhere the live database is not:
#
#   postgres-restore     a scratch instance, its own volume, dropped after every run
#   api-restore          the api image against that instance, with its OWN healthcheck,
#                        so `/readyz` answering 200 is what "the stack boots against it"
#                        means rather than a claim
#   fingerprint-restore  the same reading the manifest was taken with, against the copy
#
# `ops.restore` REFUSES to write to the live database, and the `SYNCR_LIVE_*` variables
# below are how it can: they name production, so the refusal is a comparison rather
# than a hope. A drill that does not know what production is cannot decline to
# overwrite it.
#
# EVERY IMAGE HERE IS PINNED THE WAY PRODUCTION'S ARE, and that is not decoration: a
# drill that restored into an image built on the host would prove the backup against
# something the deployment does not run.
#
# HOW THE PINNING IS ENFORCED, because Compose decides it in an order worth knowing.
# Interpolation happens per file BEFORE merging, so a `${VAR:?}` here would abort even
# when a later overlay replaces the same key: measured, and it is why the two api-image
# services below take the digest with a local-tag FALLBACK rather than a requirement.
# The requirement lives where it already did. `just restore-drill` composes
# `docker-compose.deploy.yml`, whose `api` pin has no default, so a drill on a host with
# no recorded digests stops at that message; and because the variable is the same one,
# the services below then resolve the same digest. `just drill-local` omits that overlay,
# which is what makes the drill runnable on a machine that has never deployed.
#
# The scratch Postgres carries the same literal digest the deploy overlay pins for the
# live database, crossed by a test so the two cannot drift.
# =============================================================================
name: syncr

services:
  postgres-restore:
    # postgres:16.10-bookworm, the same digest `docker-compose.deploy.yml` pins for the
    # live database. `tests/test_deploy_topology.py` asserts the two are identical: a
    # restore proven against another version is a restore proven against another server.
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    # No tuning and no archiving: this instance exists for one restore and is dropped.
    # Archiving here would ship a drill's WAL into the bucket beside production's.
    #
    # `max_connections` MATCHES THE LIVE DATABASE'S rather than being small, and that is a
    # requirement rather than a preference: Postgres refuses to replay WAL on an instance configured
    # below the server that wrote it, and aborts at startup naming the setting. Measured with 20
    # here against the live 50: `FATAL: recovery aborted because of insufficient parameter settings`.
    # `test_wal_recovery.py` crosses the two declarations so the pair cannot drift.
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      # HOW AN ARCHIVED SEGMENT REACHES THIS CONTAINER, and the rule it keeps.
      #
      # `archive_command` on the live database copies a completed segment into a volume and never
      # talks to a network, so the database container holds no bucket credential and no upload can
      # block a commit. This is the same rule in the other direction: `python3 -m ops.fetch_segment`
      # fetches ONE segment from the bucket, decrypts it with the private key a person brought to
      # the drill, and leaves it in the volume mounted read-only below. This copies it and does
      # nothing else.
      #
      # NOT BUILT FROM THE OPS IMAGE, which is the alternative and is the decision this line
      # records. That image is the one carrying rclone and python3, so a `restore_command` that
      # fetched and decrypted for itself would have to run in it -- and then the recovery would be
      # proven against an image the deployment does not run, which is the defect the pinning at the
      # top of this file exists to prevent. Two further reasons, in the order they bite: the bucket
      # credential and the PRIVATE half of the backup key would have to be inside a database
      # container, which is what keeps whoever reaches the host from reading the copies; and
      # `data-net` is `internal: true`, so this container has no route off the host to a bucket at
      # all. (gpg IS in the Postgres image, as Debian's own keyring dependency. It is the fetch that
      # cannot run there, not the decryption.)
      - "-c"
      - "restore_command=cp /var/backups/restore/wal/%f %p"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncr}
      # A DIFFERENT DATABASE NAME from production's, so the refusal in `ops.restore` has
      # two independent reasons to fire rather than one.
      POSTGRES_DB: syncr_restore
    expose:
      - "5432"
    # NO VOLUME HOLDS THE DATABASE, AND THAT IS THE DESIGN. The scratch database lives in the
    # container's own writable layer, so `docker compose rm -fsv postgres-restore` removes it and every
    # drill starts on a database that has never held anything. The one mount below is read-only and
    # holds no database state: it is where the staging one-shot leaves a decrypted segment.
    #
    # A NAMED VOLUME WAS THE FIRST VERSION AND IT WAS DANGEROUS: dropping one needs a `down -v`, never
    # safe against this project, because it is scoped to the PROJECT rather than to a service.
    # Measured, in a local run: the drill's own teardown deleted `pgdata`, the staging volume and the
    # bucket, which on the deployed host would have destroyed the live database while proving the
    # backup could be restored.
    volumes:
      # The volume `python3 -m ops.fetch` empties at the start of a drill and `python3 -m
      # ops.fetch_segment` stages into. READ-ONLY here, so the one container that replays a segment
      # cannot alter the copy it replays.
      - restore_scratch:/var/backups/restore:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncr} -d syncr_restore"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: "no"

  # The ops image, pointed at the scratch instance instead of production, and told what
  # production is so it can refuse to be pointed back.
  ops:
    environment:
      PGHOST: postgres-restore
      PGDATABASE: syncr_restore
      SYNCR_LIVE_PGHOST: postgres
      SYNCR_LIVE_PGPORT: "5432"
      SYNCR_LIVE_PGDATABASE: ${POSTGRES_DB:-syncr}
      # The private half of the backup key, brought to the drill by a person and
      # imported into a throwaway gpg home. It is off-host for the rest of the year.
      SYNCR_BACKUP_PRIVATE_KEY: ${SYNCR_BACKUP_PRIVATE_KEY:-/run/secrets/backup-recipient-private.asc}
      SYNCR_DRILL_STARTED_AT: ${SYNCR_DRILL_STARTED_AT:-}

  # A REAL BOOT, with the api's own healthcheck. `/readyz` checks the database and the
  # migration head, so this service reaching `healthy` is the criterion "boot the stack
  # against it" states, and it cannot pass against a copy that was not migrated.
  api-restore:
    image: ${SYNCR_API_DIGEST:-syncr-api:${SYNCR_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: packages/syncr-api/Dockerfile
    profiles: ["ops"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-syncr}:${POSTGRES_PASSWORD:-syncr}@postgres-restore:5432/syncr_restore
      HOST: 0.0.0.0
      # The drill boots the api to answer one question, so it runs with development's
      # relaxed startup rules rather than requiring the deployment's real secrets to be
      # present in a throwaway container.
      ENVIRONMENT: development
    expose:
      - "8000"
    networks:
      - app-net
      - data-net
    depends_on:
      postgres-restore:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
    restart: "no"

  # The same console script the manifest was written by, against the restored copy. One
  # reader, two databases: two readers could disagree and a drill would not notice.
  fingerprint-restore:
    image: ${SYNCR_API_DIGEST:-syncr-api:${SYNCR_IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: packages/syncr-api/Dockerfile
    profiles: ["ops"]
    command: ["syncr-plan-fingerprint"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-syncr}:${POSTGRES_PASSWORD:-syncr}@postgres-restore:5432/syncr_restore
      SYNCR_FINGERPRINT_PATH: /var/backups/restore/restored.fingerprint.json
    volumes:
      - restore_scratch:/var/backups/restore
    networks:
      - data-net
    depends_on:
      postgres-restore:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    restart: "no"
