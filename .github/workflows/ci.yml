name: CI

# Every job runs on every pull request, and on a push to main. No job is gated
# behind another: a lint failure must not hide a broken boundary, and the pure
# suites are fast enough that ordering buys nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ruff check, the format check, and mypy over every member, plus the census that
  # crosses every invariant label a comment cites against `docs/invariants.md`.
  # `just lint` is the same command a developer runs, so the gate cannot drift
  # from the local one.
  # ---------------------------------------------------------------------------
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace (one shared root venv, every member)
        run: uv sync --all-packages --frozen

      - name: Lint, typecheck, validate the hook config, and resolve every cited invariant label
        run: just lint

  # ---------------------------------------------------------------------------
  # The pure suites. First in the file because they are the fastest signal and the
  # modules whose failures are quietest.
  # ---------------------------------------------------------------------------
  test-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Domain and shared-infrastructure suites
        run: |
          just test-common
          just test-domain

  test-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Solver suite, including the zero-ML dependency boundary
        run: just test-solver

  test-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The fitters are pure and need nothing. The storage adapter restates every table this job reads,
    # because the api image must not carry scipy and so the api cannot depend on this member: what the
    # restated spelling actually resolves to is decidable only against a real schema.
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: syncr
          POSTGRES_PASSWORD: syncr
          POSTGRES_DB: syncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncr -d syncr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://syncr:syncr@localhost:5432/syncr
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Apply migrations as a pre-traffic one-shot
        run: just migrate

      - name: Learning and CLI suites
        run: |
          just test-learning
          just test-cli

  # ---------------------------------------------------------------------------
  # The api suite against a real Postgres. The migration one-shot runs first,
  # exactly as a deploy does, so /readyz has a head to compare against.
  # ---------------------------------------------------------------------------
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: syncr
          POSTGRES_PASSWORD: syncr
          POSTGRES_DB: syncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncr -d syncr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://syncr:syncr@localhost:5432/syncr
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Apply migrations as a pre-traffic one-shot
        run: just migrate

      - name: Api suite
        run: just test-api

  # ---------------------------------------------------------------------------
  # The frontend static gates. `just lint-frontend` is the same recipe the pre-commit
  # hook runs, so a shadowed hook binary cannot put an unlinted change on main.
  #
  # The typecheck is a separate step rather than folded into the recipe, so a red
  # result names whether a design rule or a type broke. Both must pass: vitest
  # transpiles with esbuild, which strips types without checking them.
  #
  # One of the checks builds the frontend and reads the emitted stylesheet, which
  # is why this job is also the first one to compile the application at all: a banned
  # declaration reached production for three review iterations because no job did. A second
  # one renders that stylesheet in a headless browser and reads a PIXEL, which is the one
  # input the others do not have: it needs a Chromium, and the runner image ships
  # `/usr/bin/google-chrome`, which is one of the paths it probes. It REFUSES rather than
  # skips when it finds none, so this job fails loudly if that ever stops being true rather
  # than reporting a claim it never tested.
  #
  # Node 22 is a floor, not a preference: the committed checks are TypeScript and are
  # run directly by node, which needs 22.18 or later to strip types.
  # ---------------------------------------------------------------------------
  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: The frontend checks, by specifier, by resolved directory, by emitted bytes, and by pixel
        run: just lint-frontend

      - name: tsc
        run: just typecheck-frontend

  # ---------------------------------------------------------------------------
  # The frontend unit suite, with coverage.
  # ---------------------------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: Vitest with coverage
        run: just test-frontend

  # ---------------------------------------------------------------------------
  # The Playwright suite against the Compose stack. The one job that runs the whole
  # product: a real Postgres, a real api, a real worker consuming the operation queue,
  # the built frontend served by Caddy, and the external calendar provider replaced at
  # the NETWORK boundary by an HTTP server answering a real fetch over a real socket.
  #
  # `just e2e-up` migrates as a one-shot before api and worker serve traffic, exactly as
  # a deploy does, so `/readyz` has a head to compare against.
  #
  # NOTHING PUBLISHES 5432. The e2e overlay keeps Postgres on the base file's internal
  # network with no host port, because a host-local Postgres owning that port makes a
  # compose route silently reach the wrong database. That is a runner-independent hazard
  # and the reason the recipe migrates from inside the network.
  #
  # The logs are captured on failure. A red E2E job whose only evidence is a Playwright
  # timeout is a job nobody can act on: which of the five containers refused is the
  # first question, and the answer is in their output.
  #
  # Node 22 is a floor, not a preference: the suite and its seeds are TypeScript run
  # directly by node, which needs 22.18 or later to strip types.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install the suite's locked dependency tree and the browser it drives
        run: just e2e-setup

      - name: The harness's own static gates, which nothing else in the tree reads
        run: just lint-e2e

      - name: tsc over the harness, which Playwright's esbuild does not check
        run: just typecheck-e2e

      - name: Bring the stack up and migrate it as a pre-traffic one-shot
        run: just e2e-up

      - name: The whole suite
        run: just e2e

      - name: What the stack said, when the suite went red
        if: failure()
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml logs --no-color --tail 400

      - name: Traces and screenshots from the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/test-results/
          retention-days: 7

      - name: Tear the stack down, volumes and all
        if: always()
        run: just e2e-down

  # ---------------------------------------------------------------------------
  # The codegen contract. Regenerate the committed OpenAPI document and the types
  # generated from it, and fail on any diff, so a backend change that alters the
  # contract cannot merge without the frontend seeing it.
  #
  # `git diff --exit-code` rather than a checksum: a red job then shows exactly which
  # field moved, which is the whole reason both files are committed.
  # ---------------------------------------------------------------------------
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: Regenerate the document and the types
        run: just contract

      - name: Fail on a diff
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  # ---------------------------------------------------------------------------
  # The zero-ML rule at runtime: build the api image and require `import scipy` to
  # fail inside it. The lockfile-closure test in the solver suite is the same rule
  # checked statically; this one catches a Dockerfile that copies a member it must
  # not. It is a real assertion today (no member pulls scipy yet) and becomes
  # load-bearing when the learning fitters land.
  #
  # Each recipe pairs its negative assertion with a POSITIVE CONTROL, run first,
  # because a negative assertion alone reads any non-zero exit as "the boundary holds":
  # a missing interpreter, a wrong entrypoint, a platform mismatch, an OOM, or a
  # container that never starts would all pass it silently.
  #
  # Two steps rather than one recipe, so a red result names which image broke, and both
  # call the recipe a developer runs so the check has exactly one definition.
  # ---------------------------------------------------------------------------
  image-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: The api image runs and cannot import scipy
        run: just image-boundary-api

      - name: The learning image runs and cannot import fastapi
        run: just image-boundary-learning

  # ---------------------------------------------------------------------------
  # Dependency advisories over the locked graph.
  #
  # This fails on ANY advisory rather than only on high severity: `uv audit` has no
  # severity threshold, and its JSON schema is preview and may change, so parsing a
  # severity out of it would be a gate that silently stops working. Failing on any
  # advisory is strictly stronger and cannot rot. Suppress a specific finding with
  # `--ignore <ID>` in the recipe and a comment saying why.
  # ---------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      # `npm audit` reads the lockfile rather than the installed tree, but it needs the
      # dependency metadata resolved, so the install is not optional.
      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: Audit both locked dependency graphs
        run: just audit

  # ---------------------------------------------------------------------------
  # A high-entropy secret must never reach the default branch, so the pre-commit
  # hook's check is repeated over the whole tree where it cannot be skipped.
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Scan the tree for secrets
        run: just secret-scan

  # ---------------------------------------------------------------------------
  # The committed monitoring configuration must actually load. `just monitoring-check`
  # runs `promtool check config` and `amtool check-config` over the committed files,
  # in the same images the deployment runs, so a rule file the deployed Prometheus
  # would silently refuse is a red build rather than a deployment with no alerting.
  # It needs no running stack, which is why it is a static gate here and not part of
  # a probe against the Compose stack.
  # ---------------------------------------------------------------------------
  monitoring-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Validate that the committed Prometheus rules and Alertmanager config load
        run: just monitoring-check
