name: CI

# Every job runs on every pull request, and on a push to main. No job is gated
# behind another: a lint failure must not hide a broken boundary, and the pure
# suites are fast enough that ordering buys nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ruff check, the format check, and mypy over every member. `just lint` is the
  # same command a developer runs, so the gate cannot drift from the local one.
  # ---------------------------------------------------------------------------
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace (one shared root venv, every member)
        run: uv sync --all-packages --frozen

      - name: Lint, typecheck, and validate the hook config
        run: just lint

  # ---------------------------------------------------------------------------
  # The pure suites. First in the file because they are the fastest signal and the
  # modules whose failures are quietest.
  # ---------------------------------------------------------------------------
  test-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Domain and shared-infrastructure suites
        run: |
          just test-common
          just test-domain

  test-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Solver suite, including the zero-ML dependency boundary
        run: just test-solver

  test-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The fitters are pure and need nothing. The storage adapter restates every table this job reads,
    # because the api image must not carry scipy and so the api cannot depend on this member: what the
    # restated spelling actually resolves to is decidable only against a real schema.
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: syncr
          POSTGRES_PASSWORD: syncr
          POSTGRES_DB: syncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncr -d syncr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://syncr:syncr@localhost:5432/syncr
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Apply migrations as a pre-traffic one-shot
        run: just migrate

      - name: Learning and CLI suites
        run: |
          just test-learning
          just test-cli

  # ---------------------------------------------------------------------------
  # The api suite against a real Postgres. The migration one-shot runs first,
  # exactly as a deploy does, so /readyz has a head to compare against.
  # ---------------------------------------------------------------------------
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: syncr
          POSTGRES_PASSWORD: syncr
          POSTGRES_DB: syncr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncr -d syncr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://syncr:syncr@localhost:5432/syncr
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Apply migrations as a pre-traffic one-shot
        run: just migrate

      - name: Api suite
        run: just test-api

  # ---------------------------------------------------------------------------
  # The frontend static gates. `just lint-frontend` is the same recipe the pre-commit
  # hook runs, so a shadowed hook binary cannot put an unlinted change on main.
  #
  # The typecheck is a separate step rather than folded into the recipe, so a red
  # result names whether a design rule or a type broke. Both must pass: vitest
  # transpiles with esbuild, which strips types without checking them.
  #
  # One of the eight checks builds the frontend and reads the emitted stylesheet, which
  # is why this job is also the first one to compile the application at all: a banned
  # declaration reached production for three review iterations because no job did.
  #
  # Node 22 is a floor, not a preference: the committed checks are TypeScript and are
  # run directly by node, which needs 22.18 or later to strip types.
  # ---------------------------------------------------------------------------
  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: The eight frontend checks, by specifier, by resolved directory, and by emitted bytes
        run: just lint-frontend

      - name: tsc
        run: just typecheck-frontend

  # ---------------------------------------------------------------------------
  # The frontend unit suite, with coverage.
  # ---------------------------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: Vitest with coverage
        run: just test-frontend

  # ---------------------------------------------------------------------------
  # The codegen contract. Regenerate the committed OpenAPI document and the types
  # generated from it, and fail on any diff, so a backend change that alters the
  # contract cannot merge without the frontend seeing it.
  #
  # `git diff --exit-code` rather than a checksum: a red job then shows exactly which
  # field moved, which is the whole reason both files are committed.
  # ---------------------------------------------------------------------------
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: Regenerate the document and the types
        run: just contract

      - name: Fail on a diff
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  # ---------------------------------------------------------------------------
  # The zero-ML rule at runtime: build the api image and require `import scipy` to
  # fail inside it. The lockfile-closure test in the solver suite is the same rule
  # checked statically; this one catches a Dockerfile that copies a member it must
  # not. It is a real assertion today (no member pulls scipy yet) and becomes
  # load-bearing when the learning fitters land.
  #
  # Each recipe pairs its negative assertion with a POSITIVE CONTROL, run first,
  # because a negative assertion alone reads any non-zero exit as "the boundary holds":
  # a missing interpreter, a wrong entrypoint, a platform mismatch, an OOM, or a
  # container that never starts would all pass it silently.
  #
  # Two steps rather than one recipe, so a red result names which image broke, and both
  # call the recipe a developer runs so the check has exactly one definition.
  # ---------------------------------------------------------------------------
  image-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: The api image runs and cannot import scipy
        run: just image-boundary-api

      - name: The learning image runs and cannot import fastapi
        run: just image-boundary-learning

  # ---------------------------------------------------------------------------
  # Dependency advisories over the locked graph.
  #
  # This fails on ANY advisory rather than only on high severity: `uv audit` has no
  # severity threshold, and its JSON schema is preview and may change, so parsing a
  # severity out of it would be a gate that silently stops working. Failing on any
  # advisory is strictly stronger and cannot rot. Suppress a specific finding with
  # `--ignore <ID>` in the recipe and a comment saying why.
  # ---------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up just
        uses: extractions/setup-just@v2

      # `npm audit` reads the lockfile rather than the installed tree, but it needs the
      # dependency metadata resolved, so the install is not optional.
      - name: Install the locked dependency tree
        run: npm ci
        working-directory: frontend

      - name: Audit both locked dependency graphs
        run: just audit

  # ---------------------------------------------------------------------------
  # A high-entropy secret must never reach the default branch, so the pre-commit
  # hook's check is repeated over the whole tree where it cannot be skipped.
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Sync the workspace
        run: uv sync --all-packages --frozen

      - name: Scan the tree for secrets
        run: just secret-scan
