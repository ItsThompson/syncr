[project]
name = "syncr-solver"
version = "0.1.0"
description = "syncr placement: SolveInputs plus a WeightSet to a PlanDocument with reasons. ZERO ML dependencies, which is what keeps the API image free of scipy."
requires-python = ">=3.12"
# Adding scipy, scikit-learn, or any other ML library here is a design change,
# not a dependency bump: it would put them in the API image and end the
# deterministic, literal-testable solver. `tests/test_dependency_boundary.py`
# fails the build if one appears.
dependencies = [
    "pydantic>=2.9.0,<3",
    "syncr-common",
    "syncr-domain",
]

[tool.uv.sources]
syncr-common = { workspace = true }
syncr-domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<3",
    "hypothesis>=6.100.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncr_solver"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PT018"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
files = ["src/syncr_solver", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
