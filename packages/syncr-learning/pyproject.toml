[project]
name = "syncr-learning"
version = "0.1.0"
description = "syncr offline learning: feature extraction and parameter fitting, run as a nightly one-shot. The only member that may depend on scipy or scikit-learn."
requires-python = ">=3.12"
# scipy and scikit-learn land here when the fitters do. They are ~800 MB resident
# for a job that runs nightly, which is why this is a scheduled one-shot and not a
# service, and why no other member may pull them.
dependencies = [
    "pydantic>=2.9.0,<3",
    "syncr-common",
    "syncr-domain",
]

[tool.uv.sources]
syncr-common = { workspace = true }
syncr-domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncr_learning"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PT018"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
files = ["src/syncr_learning", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
