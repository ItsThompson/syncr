[project]
name = "syncr-common"
version = "0.1.0"
description = "Shared syncr infrastructure: structured logging with redaction, the Prometheus registry and per-method metric decorator, the health contract, and the settings base. Carries no domain knowledge."
requires-python = ">=3.12"
# Upper-major caps are a safety net; the committed root uv.lock is the source of
# truth and `uv sync --frozen` enforces it. structlog (calver) is left uncapped
# so patches are never blocked.
dependencies = [
    "fastapi>=0.115.0,<1",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<3",
    # fastapi.testclient.TestClient requires httpx.
    "httpx>=0.27.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncr_common"]

[tool.ruff]
# Shared line-length/target-version/lint config lives in the repo-root ruff.toml;
# only per-package bits stay here. `src` is kept local so first-party import
# detection resolves against this package's own src/tests, not the repo root.
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert liberally (S101), pass dummy secrets as log values (S106), and
# bundle multi-condition assertions (PT018).
"tests/**/*.py" = ["S101", "S106", "PT018"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
files = ["src/syncr_common", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
