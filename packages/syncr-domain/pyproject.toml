[project]
name = "syncr-domain"
version = "0.1.0"
description = "Pure syncr domain: entities, invariants, and arithmetic. No I/O of any kind, so every module is testable with literals."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0,<3",
    "syncr-common",
]

[tool.uv.sources]
syncr-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<3",
    "hypothesis>=6.100.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncr_domain"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PT018"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
files = ["src/syncr_domain", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
