[project]
name = "syncr-api"
version = "0.1.0"
description = "syncr FastAPI application, persistence, calendar adapters, and the worker entrypoint. Two entrypoints, one package, because both need the same repositories, ORM session handling, and settings."
requires-python = ">=3.12"
# Upper-major caps are a safety net; the committed root uv.lock is the source of
# truth and `uv sync --frozen` enforces it. structlog (calver) is left uncapped so
# patches are never blocked. The `http` extra on syncr-common is what pulls the
# shared health router's fastapi dependency, which the offline learning job does
# not install.
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.14.0,<2",
    # The Authorization Server's three cryptographic needs, none of which is written
    # here: PyJWT signs and verifies the ES256 access token, cryptography generates the
    # signing keypair and encrypts it at rest, and python-multipart is what lets FastAPI
    # read the form-encoded body RFC 6749 requires on the token endpoint.
    "pyjwt>=2.10.0,<3",
    "cryptography>=44.0.0,<51",
    "python-multipart>=0.0.20,<1",
    # ICS ingest. httpx fetches a feed with a conditional GET and a hard timeout, and
    # dateutil expands an RRULE: RFC 5545 recurrence is a solved problem with a large
    # surface (BYDAY, BYSETPOS, WKST, COUNT, UNTIL), and a second implementation of it
    # would be wrong in ways only a real feed reveals.
    "httpx>=0.27.0,<1",
    "python-dateutil>=2.9.0,<3",
    "syncr-common[http]",
    "syncr-domain",
    "syncr-solver",
]

[tool.uv.sources]
syncr-common = { workspace = true }
syncr-domain = { workspace = true }
syncr-solver = { workspace = true }

[project.scripts]
syncr-api = "syncr_api.api.main:main"
syncr-worker = "syncr_api.worker.main:main"
syncr-bootstrap-user = "syncr_api.accounts.bootstrap:main"
syncr-rotate-oauth-key = "syncr_api.oauth.rotation:main"
syncr-plan-fingerprint = "syncr_api.recovery.main:main"
syncr-drill-seed = "syncr_api.recovery.drill_seed:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<3",
    "types-python-dateutil>=2.9.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncr_api"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert liberally (S101), name dummy credentials as constants (S105) and pass
# them as arguments (S106), bundle multi-condition assertions (PT018), catch broad
# exceptions to skip when a dependency is unavailable (BLE001), and exercise the
# bind-all host as test data (S104).
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "PT018", "BLE001"]
# Alembic generates a revision from alembic/script.py.mako, whose header imports
# Sequence at runtime for the revision-identifier annotations. A generated file must
# not need a hand edit to pass lint.
"alembic/versions/*.py" = ["TC003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
# `../../deployments` puts the deployment's own `ops` package on the path under its real name, so
# `import ops.retention` resolves the same way it does inside the backup image.
mypy_path = "src:../../deployments"
# `scripts` holds the committed OpenAPI exporter, which a CI job executes. A script a gate runs
# belongs inside the gate. `../../deployments/ops` is the nightly backup, the WAL shipper and the
# restore drill: it is not a workspace member, because it must run beside `pg_dump` in an image with
# no application package in it, and this is the one member with a database and a migration chain to
# check it against.
files = ["src/syncr_api", "alembic", "scripts", "tests", "../../deployments/ops"]

# asyncpg ships no type information. It is normally reached only through SQLAlchemy's own typed
# surface; the event listener is the one place that connects with the driver directly, because
# `LISTEN` is per session and a pooled connection cannot hold one.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# "." puts the packaged `tests` on the import path so test modules use absolute
# imports (`from tests.conftest import ...`); "src" keeps first-party `syncr_api`
# imports resolving. "../../deployments" is what makes `import ops.dump` in a test resolve to the
# same package the backup image runs.
pythonpath = ["src", ".", "../../deployments"]
testpaths = ["tests"]
# `-m "not google_live"` is what keeps the one suite that talks to a real provider out of the
# default run: it needs credentials nobody commits, a network, and a real account's quota. Run it
# deliberately with `uv run pytest -m google_live`.
addopts = "--strict-markers --strict-config -m 'not google_live'"
asyncio_mode = "auto"
markers = [
    "integration: requires a reachable Postgres (DATABASE_URL); skipped when absent.",
    "google_live: talks to the real Google Calendar API; excluded from the default run.",
]
