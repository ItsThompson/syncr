[project]
name = "syncr-api"
version = "0.1.0"
description = "syncr FastAPI application, persistence, calendar adapters, and the worker entrypoint. Two entrypoints, one package, because both need the same repositories, ORM session handling, and settings."
requires-python = ">=3.12"
# Upper-major caps are a safety net; the committed root uv.lock is the source of
# truth and `uv sync --frozen` enforces it. structlog (calver) is left uncapped so
# patches are never blocked. The `http` extra on syncr-common is what pulls the
# shared health router's fastapi dependency, which the offline learning job does
# not install.
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.14.0,<2",
    "syncr-common[http]",
    "syncr-domain",
    "syncr-solver",
]

[tool.uv.sources]
syncr-common = { workspace = true }
syncr-domain = { workspace = true }
syncr-solver = { workspace = true }

[project.scripts]
syncr-api = "syncr_api.api.main:main"
syncr-worker = "syncr_api.worker.main:main"
syncr-bootstrap-user = "syncr_api.accounts.bootstrap:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<3",
    "httpx>=0.27.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncr_api"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert liberally (S101), name dummy credentials as constants (S105) and pass
# them as arguments (S106), bundle multi-condition assertions (PT018), catch broad
# exceptions to skip when a dependency is unavailable (BLE001), and exercise the
# bind-all host as test data (S104).
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "PT018", "BLE001"]
# Alembic generates a revision from alembic/script.py.mako, whose header imports
# Sequence at runtime for the revision-identifier annotations. A generated file must
# not need a hand edit to pass lint.
"alembic/versions/*.py" = ["TC003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
files = ["src/syncr_api", "alembic", "tests"]

[tool.pytest.ini_options]
# "." puts the packaged `tests` on the import path so test modules use absolute
# imports (`from tests.conftest import ...`); "src" keeps first-party `syncr_api`
# imports resolving.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires a reachable Postgres (DATABASE_URL); skipped when absent.",
]
