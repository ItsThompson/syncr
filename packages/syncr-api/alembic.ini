# Alembic configuration for syncr.
#
# The chain is forward-only with exactly one head: a branched history on a single
# deployable is complexity with no payoff. Migrations run as an explicit one-shot
# before the api and the worker start, never at application startup, so two
# replicas cannot race.
#
# sqlalchemy.url is deliberately omitted: env.py reads DATABASE_URL through
# syncr_api settings, so the application, the migrations, and the tests share one
# source of truth for the connection string.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
