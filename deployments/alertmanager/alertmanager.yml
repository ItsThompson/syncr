# Alertmanager routing for the syncr stack. ONE channel, deliberately.
#
# `18-observability.md`: "Alertmanager routes to a single channel. On a personal deployment, alert
# fatigue is the failure mode to design against." A severity-per-channel fan-out would give the same
# person three inboxes to check and no more information.
#
# The receiver is a webhook rather than an email or a chat integration, and the URL is read from a
# FILE rather than named here: a credential in a file in the repository is a credential in the
# repository. Alertmanager performs no environment expansion in its own configuration, so `url_file`
# is the mechanism rather than a variable, and the deploy path writes
# `deployments/alertmanager/webhook_url` from the host's secret store.
#
# With the file absent the receiver posts nowhere and every alert is still visible in the
# Alertmanager UI on `app-net`, which is a deployment with reduced reach rather than a broken one.
#
# GROUPING IS BY ALERTNAME AND SEVERITY, not by instance. This is one host: two firing alerts are two
# different problems, and a burst of the SAME alert is one problem the operator should be told about
# once.
#
# NOTHING HERE IS SCOPED BY `deployment` ALONE. That label is an `external_labels` entry, so it is
# identical on every alert Prometheus sends: using it to mean "the same thing" makes a rule match
# everything. See the note above the inhibit rules, which is where that cost anyone anything.

global:
  # How long a firing alert is held before it is treated as resolved once its series stops. Longer
  # than the longest `for` window in the rules, so a rule that has been firing for a day does not
  # resolve and refire across a scrape gap.
  resolve_timeout: 10m

route:
  receiver: syncr-single-channel
  group_by: ["alertname", "severity"]
  # Wait this long before sending a new group, so two alerts from one cause arrive together.
  group_wait: 30s
  # Then this long before adding newly-firing members to a group that has already been sent.
  group_interval: 5m
  # And this long before repeating an alert that is still firing. Four hours rather than one: a
  # critical that has been firing all night is not more actionable for having been sent twelve times.
  repeat_interval: 4h

  routes:
    # Critical is the only class that shortens the repeat, because it is the only class where the
    # cost of not being told again is data or a plan that never reaches the phone.
    - matchers:
        - severity = "critical"
      receiver: syncr-single-channel
      repeat_interval: 1h

inhibit_rules:
  # EVERY INHIBIT RULE NAMES ITS SOURCE BY `alertname`, and that is a rule rather than a style.
  #
  # The obvious shape, "a critical suppresses a warning", was here and was WRONG in a way syntax
  # cannot show. It was scoped with `equal: ["deployment"]`, and `deployment` is an `external_labels`
  # entry in `prometheus.yml`, so Prometheus stamps the same value on all twelve rules. The rule
  # therefore read: ANY firing critical suppresses EVERY firing warning. `BackupStale` fires
  # unconditionally until ticket 58 writes its metric, so ten minutes after the stack first started,
  # all seven warnings stopped being deliverable. Posting four alerts to a real Alertmanager returned
  # `ProbeSlow` and `DiskFillingUp` as `suppressed, inhibitedBy: [BackupStale]`.
  #
  # It is DELETED rather than rescoped, because a class is not a cause: what a scoped version would
  # have needed is a `subsystem` label the rules do not carry, and the one real critical-and-warning
  # pair that shares a cause is named below instead. `test_alert_rules.py` asserts that every rule
  # here names BOTH its source and its targets by `alertname`, because constraining the source alone
  # left the same defect one edit away: `alertname="BackupStale"` targeting `severity="warning"`
  # suppressed all seven warnings in a real Alertmanager while the whole suite and `amtool` passed.
  #
  # `deployments/bin/alertmanager-probe.py` drives this file through a real Alertmanager, because
  # that is the one artefact `amtool check-config` cannot judge.

  # One outage, one page. A process that is gone is the cause of every duty that stopped, so the four
  # alerts below say nothing this one does not, and each would otherwise arrive as its own page for
  # the same repair. Nothing about a dead token or a slow request path is caused by this, so neither
  # is a target.
  - source_matchers:
      - alertname = "DatabaseUnreachable"
    target_matchers:
      - alertname =~ "SolveFailing|ProjectionFailing|HorizonNotMaintained|SourceStale"
    equal: ["deployment"]

  # ONE GOOGLE GRANT SERVES BOTH THE ANCHOR READS AND THE WRITE TARGET. `calendars/injection.py`
  # composes the Google anchor adapter's token source from the same
  # `GoogleCredentialRepository(session, tenant_id)` row the projection writes with, and a tenant has
  # one. So a revoked grant fires `WriteTargetTokenExpiring` at once and `SourceStale` twenty-four
  # hours later on every Google-provider anchor source, for ONE repair: reconnect the account.
  #
  # This is the pair whose absence made the blanket rule's deletion rationale wrong. "No critical
  # shares a subsystem with any warning" was false, and it was false HERE. The rule is cause-named
  # rather than severity-scoped, which is the distinction that matters.
  - source_matchers:
      - alertname = "WriteTargetTokenExpiring"
    target_matchers:
      - alertname =~ "SourceStale|ProjectionFailing"
    equal: ["deployment"]

receivers:
  - name: syncr-single-channel
    webhook_configs:
      - url_file: /etc/alertmanager/webhook_url
        # Every alert in the group is sent, not just the first: the group exists to batch delivery,
        # not to drop members.
        send_resolved: true
        max_alerts: 0
