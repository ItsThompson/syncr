# Prometheus scrape configuration for the syncr stack.
#
# Everything here runs on `app-net`, and nothing publishes a host port: the Cloudflare tunnel is the
# only ingress and it fronts the api and the frontend, not this. `/metrics` is therefore reachable
# only from inside the network, which is the rule `18-observability.md` states for it.
#
# THREE PROCESSES, THREE JOBS, and that is deliberate rather than tidy. The api, the worker and the
# nightly learning one-shot each hold their OWN registry in their own process, so a figure that
# arrived under one job name from either process would make "which one stopped" unanswerable. The
# whole plan pipeline is recorded in the worker: solves, materializations, verdict transitions,
# projections, calendar syncs, the horizon reading, and the four product metrics. Scraping only the
# api would leave every one of them unread.
#
# The learning job has no HTTP surface at all, because a one-shot container has exited by the time a
# scrape would arrive. It writes its exposition to a file and the node exporter's textfile collector
# serves it, which is also how the nightly backup publishes its completion timestamp.

global:
  # Fifteen seconds is short enough that a two-minute readiness alert has eight samples behind it,
  # and long enough that a personal deployment's retention is measured in months.
  scrape_interval: 15s
  scrape_timeout: 10s
  # The rules are stated over windows of minutes and hours, so evaluating more often than the scrape
  # interval would only re-read the same samples.
  evaluation_interval: 30s
  external_labels:
    deployment: syncr

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The api's own registry: HTTP families, the probe and the assembly on the request path, the SSE
  # gauge, and the database pool of the api's process.
  - job_name: syncr-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          process: api

  # The worker's registry, on its own port. Without this job the plan pipeline is instrumented and
  # unread: every family listed in the header above lives here.
  - job_name: syncr-worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          process: worker

  # The host: CPU, memory, disk, and the textfile collector that carries the nightly learning run's
  # figures and the backup's completion timestamp.
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  # Per-container CPU and memory, and the memory LIMIT each container declares. The limit is the
  # figure the System dashboard draws usage against: a container approaching one is visible before
  # the kernel intervenes.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Postgres itself: connections, transaction rates, and `pg_up`, which is what
  # `DatabaseUnreachable` is stated over.
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
