<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>syncr &middot; assembled screens</title>

<!-- Tokens are LINKED, not copied, so this sheet cannot drift from frontend/src/tokens.
     index.css @imports primitives, color, type and layout in layer order. -->
<link rel="stylesheet" href="../../frontend/src/tokens/index.css">
<!-- The week grid's own geometry moved out of the token layer and beside the component that owns
     it, so this sheet links both halves of what it renders from. Linked, not copied either way. -->
<link rel="stylesheet" href="../../frontend/src/ui/domain/week-grid/tokens.css">
<!-- The strip's and the verdict panel's reserved heights moved beside those two components, and the reason
     record's clause-label column beside `ReasonRows`, on the same argument. -->
<link rel="stylesheet" href="../../frontend/src/ui/domain/verdict-panel/tokens.css">
<link rel="stylesheet" href="../../frontend/src/ui/domain/reason-rows/tokens.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   syncr: all seven routes, their modes, first run and the overlays, assembled.
   Every value resolves to a token from frontend/src/tokens, or is a layer-2
   component token defined here from layer-1 values.

   MOTION IS ZERO, WITHOUT EXCEPTION. There is no transition, animation, keyframe
   or transform in this file. Every state change is a discrete redraw.

   The grid engine, the block CSS and the columns algorithm are ported from
   docs/design/scratch/week-density.html and must not diverge from it.
   ============================================================================ */
:root{
  /* Layer 2, this document only. Each references layer 1. */
  --docbar: 33px;
  --band-h: 72px;   /* the page band that carries a serif title */
  --rbar-h: 9px;    /* a ranked or deviation bar: a rectangle, not a chart */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--text);
  font-family:var(--font-mono);font-size:var(--fs-chrome);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:400}
a{color:var(--ink-bright);text-decoration:none}
button{font:inherit;border-radius:var(--radius);cursor:pointer}
:focus-visible{outline:var(--state-focus-ring);outline-offset:var(--state-focus-offset)}
/* The dialog header is the one ink-filled surface in the product, so it is the one place
   the inverse ring applies. The ring is chosen by the surface it LANDS on, not by the
   element's own fill, and it is scoped to the container so anything focusable added here
   later inherits the correct ring. The sidebar is paper and needs no such scope. */
.dlg>header :focus-visible{outline:var(--state-focus-ring-inverse);
  outline-offset:var(--state-focus-offset)}

/* ---------- micro-typography, shared ---------- */
.eyebrow{font-size:var(--fs-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
.eyebrow.on{color:var(--ink-deep)}
.lab{font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}
.n{font-variant-numeric:tabular-nums}
.mut{color:var(--text-muted)}
.key{color:var(--ink-deep);white-space:nowrap;letter-spacing:.04em}
code{background:var(--ink-wash);padding:0 3px;font-size:.92em}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-bright);vertical-align:1px}
.dot.v{background:var(--signal-verdigris)}
.dot.a{background:var(--signal-amber)}
.dot.o{background:var(--signal-oxide)}
.dot.hollow{background:transparent;border:var(--hairline) solid var(--ink-bright)}

/* ---------- document frame: the view switcher, NOT app chrome ---------- */
.doc{position:sticky;top:0;z-index:60;display:flex;align-items:stretch;height:var(--docbar);
  background:var(--paper);border-bottom:var(--hairline) solid var(--rule-strong);overflow-x:auto}
.doc>.id{display:flex;align-items:center;padding:0 12px;background:var(--ink-bright);
  color:var(--on-ink);font-size:var(--fs-eyebrow);letter-spacing:.16em;
  text-transform:uppercase;white-space:nowrap}
.doc button{display:flex;align-items:center;gap:6px;padding:0 11px;background:transparent;
  border:0;border-right:var(--hairline) solid var(--rule);font-size:var(--fs-label);
  letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink);white-space:nowrap}
.doc button:hover{background:var(--state-hover)}
.doc button[aria-current]{background:var(--ink);color:var(--on-ink)}
.doc button i{font-style:normal;color:var(--text-muted)}
.doc button[aria-current] i{color:var(--rule)}
.doc>.meta{display:flex;align-items:center;gap:14px;padding:0 13px;margin-left:auto;white-space:nowrap}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--w-sidebar) minmax(0,1fr);
  height:calc(100vh - var(--docbar));overflow:hidden}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto}
.pad{padding:13px 15px 20px}
.gap{display:flex;flex-direction:column;gap:13px}

/* ---------- the sidebar: PAPER, not ink ----------
   The inherited language fills its sidebar with --ink-deep. Rendered on a screen whose
   whole point is a calm grid it dominated, and it spent the loudest treatment in the
   system on the most permanent surface. So the sidebar is paper, and the current item
   takes --ink-wash plus a 3px --ink-deep left rule: the same channel a selected block
   uses. One idea, one form. */
.side{background:var(--paper-raised);border-right:var(--hairline) solid var(--rule-strong);
  display:flex;flex-direction:column;overflow:hidden}
.side .brand{padding:13px 13px 11px;border-bottom:var(--hairline) solid var(--rule)}
.side .brand b{display:block;font-family:var(--font-serif);font-size:23px;line-height:1.05;
  font-weight:400;letter-spacing:var(--ls-wordmark);color:var(--ink-deep)}
.side .brand span{display:block;margin-top:4px;font-size:var(--fs-eyebrow);
  letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
.side .grp{padding:11px 13px 4px;font-size:var(--fs-eyebrow);letter-spacing:var(--ls-eyebrow);
  text-transform:uppercase;color:var(--text-muted)}
.side nav a{display:flex;align-items:center;gap:8px;height:var(--h-control);padding:0 13px;
  color:var(--ink);font-size:10.5px;letter-spacing:var(--ls-nav);text-transform:uppercase;
  border-left:var(--state-selected-border) solid transparent}
.side nav a:hover{background:var(--state-hover)}
.side nav a[aria-current]{background:var(--state-hover);color:var(--ink-deep);
  border-left-color:var(--state-selected-color)}
.side nav a .c{margin-left:auto;color:var(--text-muted);letter-spacing:.04em}
.side .foot{margin-top:auto;border-top:var(--hairline) solid var(--rule);padding:9px 13px 11px;
  font-size:var(--fs-eyebrow);line-height:1.7;color:var(--text-muted)}
.side .foot b{display:block;color:var(--ink-deep);font-weight:400;letter-spacing:.04em}
svg.ic{width:var(--icon-sm);height:var(--icon-sm);flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:var(--icon-stroke);stroke-linecap:var(--icon-cap);stroke-linejoin:var(--icon-join)}

/* ---------- the page band: the only place a serif title appears ---------- */
.band{border-bottom:var(--hairline) solid var(--rule-strong);background:var(--paper-raised);
  padding:11px 15px;min-height:var(--band-h);display:flex;align-items:flex-end;
  gap:16px;flex-wrap:wrap}
.band h1{font-family:var(--font-serif);font-size:var(--fs-title);line-height:var(--lh-tight);
  letter-spacing:.01em;color:var(--ink-deep)}
.band .sub{font-size:var(--fs-eyebrow);line-height:1.6;color:var(--text-muted)}
.band .right{margin-left:auto;display:flex;gap:8px;align-items:flex-end}
/* A MODE GETS NO SERIF. The weekly session and the pie review are modes of a screen, not
   destinations, so the serif stays sealed to the wordmark and the seven page titles. */
.modehead{border-bottom:var(--hairline) solid var(--rule-strong);background:var(--ink-wash);
  padding:8px 15px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.modehead b{font-size:var(--fs-data);color:var(--ink-deep);font-weight:400}

/* ---------- a banner: severity volume 3. Only a conflict earns one ---------- */
.banner{display:flex;align-items:center;gap:11px;padding:7px 15px;
  border-bottom:var(--hairline) solid var(--rule-strong);background:var(--paper-raised);
  border-left:var(--state-conflict-border) solid var(--signal-oxide)}
.banner b{color:var(--oxide-ink);font-weight:400;font-size:10.5px}
.banner p{margin:0;font-size:var(--fs-eyebrow);color:var(--ink)}
.banner .acts{margin-left:auto;display:flex;gap:7px}

/* ---------- controls ---------- */
.btn{font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase;
  height:var(--h-control);padding:0 13px;background:var(--ink);color:var(--on-ink);
  border:var(--hairline) solid var(--ink)}
.btn.sec{background:var(--paper-raised);color:var(--ink-deep);border-color:var(--rule-control)}
.btn.ter{background:transparent;border-color:transparent;color:var(--ink);height:auto;
  padding:0 2px;border-bottom:var(--hairline) dotted var(--rule-control)}
.btn:disabled{background:transparent;color:var(--text-muted);border-style:dashed;
  border-color:var(--text-muted);cursor:not-allowed}
.btn.sm{height:var(--h-control-sm);padding:0 9px}
input[type=text],input[type=number],input[type=time],select,textarea{font:inherit;
  font-size:var(--fs-chrome);background:var(--paper-raised);color:var(--ink);
  border:var(--hairline) solid var(--rule-control);border-radius:var(--radius);
  padding:0 7px;height:var(--h-control);font-variant-numeric:tabular-nums}
textarea{padding:5px 7px;height:auto;line-height:var(--lh-chrome);resize:vertical;width:100%}
.selw{position:relative;display:inline-block}
.selw::after{content:'\25BE';position:absolute;right:7px;top:0;line-height:var(--h-control);
  pointer-events:none;color:var(--text-muted)}
select{appearance:none;-webkit-appearance:none;padding-right:22px}
.seg{display:flex;border:var(--hairline) solid var(--rule-control)}
.seg button{background:var(--paper-raised);color:var(--ink);border:0;
  border-right:var(--hairline) solid var(--rule);height:var(--h-control);padding:0 10px;
  font-size:var(--fs-label);letter-spacing:var(--ls-label);text-transform:uppercase}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.stepper{display:inline-flex;align-items:stretch}
.stepper input{width:62px;text-align:right;border-right:0}
.stepper button{width:var(--h-control);background:var(--paper-raised);color:var(--ink-deep);
  border:var(--hairline) solid var(--rule-control);border-left:0}

/* ---------- panel and table ---------- */
.panel{border:var(--hairline) solid var(--rule-strong);background:var(--paper-raised)}
.panel>header{padding:4px 9px;border-bottom:var(--hairline) solid var(--rule);
  background:var(--ink-wash);font-size:var(--fs-eyebrow);letter-spacing:var(--ls-eyebrow);
  text-transform:uppercase;color:var(--ink-deep);display:flex;gap:9px;align-items:baseline}
.panel>header .r{margin-left:auto;color:var(--text-muted);letter-spacing:.06em;text-transform:none}
.panel>.in{padding:11px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.cols21{display:grid;grid-template-columns:2fr 1fr;gap:13px}
table{border-collapse:collapse;width:100%;font-size:var(--fs-chrome)}
th{text-align:left;font-weight:400;font-size:9px;letter-spacing:var(--ls-eyebrow);
  text-transform:uppercase;color:var(--text-muted);padding:0 9px;height:24px;
  border-bottom:var(--hairline) solid var(--rule-strong);white-space:nowrap}
td{padding:0 9px;height:var(--h-row);border-bottom:var(--hairline) solid var(--rule);
  color:var(--ink);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.idx{color:var(--text-muted);width:26px}
tbody tr:hover td{background:var(--state-hover)}
tr[data-current] td{background:var(--state-hover)}
tr[data-current] td:first-child{box-shadow:inset var(--state-selected-border) 0 0 0 var(--state-selected-color)}
table.data td{font-size:var(--fs-data)}
table.dense td{height:var(--h-row-dense)}

/* ---------- Area chip: the ledger-surface carrier, always beside the name ---------- */
.chip{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0;
  background:var(--ai)}
.areaname{display:inline-flex;align-items:center;gap:6px}

/* Deviation bars are COBALT ONLY, and that includes the label column. Actual against target
   per Area, signed off a zero rule. Area ink encodes identity; cobalt encodes magnitude and
   direction. A chart row is a chart context end to end: putting a chip beside a cobalt bar
   would teach the reader that the bar might be Area-colored, which muddies the one rule
   this component exists to demonstrate. The Area name does the identifying, which is what a
   name is for. */
.dev{display:grid;grid-template-columns:96px 1fr 62px;gap:9px;align-items:center;
  padding:4px 0;border-bottom:var(--hairline) solid var(--rule);font-size:var(--fs-eyebrow)}
.dev:last-child{border-bottom:0}
.devtrack{position:relative;height:var(--rbar-h);background:var(--ink-wash)}
.devtrack::before{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;
  border-left:var(--hairline) solid var(--rule-strong)}
.devfill{position:absolute;top:0;bottom:0;background:var(--ink)}
.dev .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- maturity meter: bounded, so block characters ---------- */
.meter{font-size:13px;letter-spacing:-.5px;line-height:1;color:var(--ink)}
.meter i{font-style:normal;color:var(--rule)}

/* ---------- ledger row: the Today register ---------- */
.led{border:var(--hairline) solid var(--rule-strong);background:var(--paper-raised)}
.ledrow{display:grid;grid-template-columns:74px 46px 1fr auto;gap:9px;align-items:center;
  padding:0 9px;height:var(--h-row);border-bottom:var(--hairline) solid var(--rule);
  border-left:var(--state-selected-border) solid transparent}
.ledrow:last-child{border-bottom:0}
.ledrow:hover{background:var(--state-hover)}
.ledrow[data-selected]{border-left-color:var(--state-selected-color)}
.ledrow[data-frame]{background:var(--frame-wash);color:var(--ink-soft)}
.ledrow .t{font-variant-numeric:tabular-nums;color:var(--text-muted);font-size:var(--fs-eyebrow)}
.ledrow .d{font-variant-numeric:tabular-nums;text-align:right;color:var(--text-muted);font-size:var(--fs-eyebrow)}
.ledrow .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ledrow .out{display:flex;gap:5px;align-items:center}
.ledrow .out .st{font-size:var(--fs-eyebrow);letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted)}
.ledsec{padding:4px 9px;background:var(--ink-wash);font-size:var(--fs-eyebrow);
  letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--ink-deep);
  border-bottom:var(--hairline) solid var(--rule)}

/* ============================================================================
   THE WEEK GRID. Ported from docs/design/scratch/week-density.html. Do not edit
   here without editing there: the two must not diverge.
   ============================================================================ */
.strip{height:var(--strip-h);flex:0 0 auto;display:flex;align-items:stretch;
  border-bottom:var(--hairline) solid var(--rule-strong);background:var(--paper)}
.strip>div{padding:7px 11px;border-right:var(--hairline) solid var(--rule);min-width:0}
.strip>div:last-child{border-right:0;flex:1}
.strip .lab{white-space:nowrap}
.strip data{display:block;margin-top:3px;font-size:19px;line-height:var(--lh-tight);
  color:var(--ink);font-variant-numeric:tabular-nums}
.strip small{display:block;margin-top:2px;font-size:9px;color:var(--text-muted);white-space:nowrap}
/* The verdict is amber: the week is impossible, not broken. A notice, not a failure. It is
   a PANEL in the severity ladder, never a banner and never blocking, because syncr does not
   block approval of a knowingly-broken week. Its height is FIXED and its rows scroll inside
   it, so it cannot shift the grid under the cursor as pins accumulate. */
.verd{border-left:var(--state-conflict-border) solid var(--signal-amber)!important;
  background:var(--amber-wash);display:flex;flex-direction:column;justify-content:center}
.verd b{font-size:10.5px;color:var(--ink-deep)}
.verd p{margin:2px 0 0;font-size:9.5px;line-height:1.45;color:var(--ink)}
.gridwrap{display:flex;flex:1;min-height:0;overflow:auto;background:var(--paper-raised)}
.axis{width:var(--axis-w);flex:0 0 auto;border-right:var(--hairline) solid var(--rule);
  position:sticky;left:0;z-index:8;background:var(--paper-raised)}
.axis .hd{height:var(--day-header-h);border-bottom:var(--hairline) solid var(--rule-strong);
  background:var(--ink-wash);position:sticky;top:0;z-index:2}
.axis .hh{position:absolute;right:4px;font-size:var(--fs-eyebrow);color:var(--text-muted);
  line-height:1.35;margin-top:1px;padding:0 3px;background:var(--paper-raised);
  font-variant-numeric:tabular-nums}
.cols{display:flex;flex:1;min-width:0}
.col{flex:1;min-width:var(--col-min);position:relative;border-right:var(--hairline) solid var(--rule)}
.col:last-child{border-right:0}
.colhead{height:var(--day-header-h);border-bottom:var(--hairline) solid var(--rule-strong);
  display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--ink-wash);
  font-size:var(--fs-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;
  color:var(--ink-deep);position:sticky;top:0;z-index:3;white-space:nowrap;overflow:hidden}
.colhead i{font-style:normal;margin-left:auto;color:var(--text-muted);letter-spacing:.04em}
.colhead.unconf::after{content:'\25CB';color:var(--ink-bright);font-size:8px}
.canvas{position:relative}
.canvas .maj,.canvas .min{position:absolute;left:0;right:0;height:0;pointer-events:none}
/* The quarter hour is drawn at rest, because the snap is 15 minutes and the grid should show
   where a block can land. The hour alone carries cobalt weight; the three quarters are faint.
   During a drag the quarters step up to hour weight so the snap targets sharpen. */
.canvas .maj{border-top:var(--hairline) solid var(--grid-line-hour)}
.canvas .min{border-top:var(--hairline) solid var(--grid-line-quarter)}
.dragging .canvas .min{border-top-color:var(--grid-line-quarter-drag)}
.blk{position:absolute;left:var(--grid-inset);right:var(--grid-inset);
  background:var(--paper-raised);
  border:0;border-top:var(--hairline) solid var(--rule);
  border-bottom:var(--hairline) solid var(--rule);
  border-left:var(--state-selected-border) solid transparent;
  padding:var(--block-pad-t) var(--block-pad-x) var(--block-pad-b);overflow:hidden;
  font-size:var(--fs-block);line-height:var(--lh-block);color:var(--ink);
  outline-offset:var(--state-focus-offset);cursor:default}
.blk[data-area]{border-top:var(--rule-emphasis) solid var(--ai)}
.blk .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,1);
  overflow:hidden;overflow-wrap:anywhere}
.blk .g{float:right;margin-left:4px;color:var(--ink-deep);font-size:10px;line-height:1.2}
.blk.frame{background:var(--frame-wash);color:var(--ink-soft)}
.blk.anchor{background-color:var(--paper-raised);
  background-image:repeating-linear-gradient(135deg,var(--rule) 0 1px,transparent 1px 7px);
  border-top-color:var(--ink-deep)}
.blk:hover{background-color:var(--state-hover)}
.blk:focus-visible{outline:var(--state-focus-ring);z-index:6}
.blk[data-selected]{border-left-color:var(--state-selected-color)}
.blk[data-conflict]{border-left-color:var(--state-conflict-color)}
.blk[data-pinned] .pin{display:inline}
.pin{display:none}
/* proposal: the one state with NO fill. Absence of fill is unclaimed by any other state,
   needs no new pigment, and survives forced colors, where a fill is dropped anyway. */
.blk[data-proposal]{background:transparent;background-image:none;
  border:var(--hairline) dashed var(--ink-deep);
  border-left:var(--state-selected-border) solid transparent;color:var(--ink-soft)}
.blk[data-split]{border-left:var(--hairline) solid var(--rule)}
.blk[data-split][data-selected]{border-left:var(--state-selected-border) solid var(--state-selected-color)}
.blk[data-tier=compact]{font-size:var(--fs-block-compact);line-height:var(--lh-block-compact);
  padding-top:0}
.blk[data-tier=sliver] .t,.blk[data-tier=hair] .t{display:none}
.blk[data-tier=hair]{padding:0;border-bottom-width:0}
.forbid{position:absolute;left:0;right:0;pointer-events:none;z-index:0;
  --hatch-ink:var(--forbidden-hatch-ink);background-image:var(--hatch-back);
  border-top:var(--hairline) dotted var(--rule);border-bottom:var(--hairline) dotted var(--rule)}
.forbid span{position:absolute;left:4px;top:1px;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-muted);background:var(--paper-raised);padding:0 2px}
.now{position:absolute;left:0;right:0;height:0;border-top:var(--now-rule) solid var(--ink-bright);z-index:5}
.nowlab{position:absolute;right:3px;font-size:9px;color:var(--ink-bright);
  background:var(--paper-raised);padding:0 2px;margin-top:-6px;font-variant-numeric:tabular-nums}
/* the discrete drag marker. The block does not move: a hairline snaps to the quarter hour
   and the block redraws once, on drop. Continuous input, discrete output. */
.dragmk{position:absolute;left:0;right:0;height:0;
  border-top:var(--rule-emphasis) dashed var(--ink-deep);z-index:7}
.dragmk::after{content:attr(data-at);position:absolute;left:3px;top:2px;font-size:9px;
  background:var(--ink-deep);color:var(--on-ink);padding:0 3px;letter-spacing:.06em}

/* ---------- detail panel ---------- */
.detail{border-left:var(--hairline) solid var(--rule-strong);background:var(--paper);
  width:var(--w-detail);flex:0 0 auto;padding:11px;overflow-y:auto}
.detail .ttl{font-size:var(--fs-data);color:var(--ink-deep);line-height:1.3}
.detail dl{margin:9px 0 0;font-size:var(--fs-eyebrow);line-height:1.75}
.detail dl div{display:flex;justify-content:space-between;gap:8px;
  border-bottom:var(--hairline) dotted var(--rule)}
.detail dt{letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}

/* A trailing marker on the Area field carries a state, so the fixture stays one line per
   block: * is pinned, ! is the selected block, ? is a proposal target. */
const flag = a => ({area:(a||'').replace(/[*!?]/g,'') || null,
                    pin:/\*/.test(a||''), sel:/!/.test(a||''), prop:/\?/.test(a||'')});

/* Sweep and columns: cluster by a running maximum end, then give each block the leftmost
   column whose last block has already finished. No special case for any origin, so nothing
   can paint over anything, and no magic threshold decides who wins. */
function layout(rows){
  const bs = rows.map(r => {
    const [t, title, origin, area] = r.split('|');
    const [s, e] = t.split('-');
    return {s:min(s), e:min(e), title, origin, ...flag(area)};
  }).sort((a,b) => a.s - b.s || b.e - a.e);
  const clusters = []; let cur = [], curEnd = -1;
  for(const b of bs){
    if(cur.length && b.s < curEnd){ cur.push(b); curEnd = Math.max(curEnd, b.e); }
    else { if(cur.length) clusters.push(cur); cur = [b]; curEnd = b.e; }
  }
  if(cur.length) clusters.push(cur);
  const maxSplit = parseInt(raw('--overlap-max-split'));
  for(const c of clusters){
    const ends = [];
    for(const b of c){
      let col = ends.findIndex(end => end <= b.s);
      if(col === -1){ col = ends.length; ends.push(b.e); } else ends[col] = b.e;
      b.i = col;
    }
    c.forEach(b => { b.n = ends.length; b.stagger = ends.length > maxSplit; });
  }
  return bs;
}

function blockHTML(b, ppm){
  const top = (b.s - AXIS_START) * ppm, h = (b.e - b.s) * ppm;
  const tier = h >= px('--block-h-label') ? 'label'
             : h >= px('--block-h-compact') ? 'compact'
             : h >= px('--block-h-sliver') ? 'sliver' : 'hair';
  const a = b.area ? AREA[b.area] : null;
  const ind = px('--overlap-indent');
  let pos;
  if(b.n === 1) pos = 'left:var(--grid-inset);right:var(--grid-inset)';
  else if(!b.stagger) pos = `left:${(b.i*100/b.n).toFixed(3)}%;right:${((b.n-1-b.i)*100/b.n).toFixed(3)}%`;
  else pos = `left:${b.i*ind}px;right:var(--grid-inset);z-index:${b.i+1}`;
  const lines = tier === 'compact' ? 1 : Math.max(1, Math.floor((h - 5) / px('--lh-block-px')));
  const titled = tier === 'label' || tier === 'compact';
  const g = titled
    ? (b.pin ? `<span class="g pin">${MARK_PINNED}</span>` : '')
      + (b.stagger && b.i === b.n-1 ? `<span class="g">&#10697;&nbsp;${b.n}</span>` : '')
    : `<span class="g">${GLYPH[b.origin]}</span>`;
  const plain = b.title.replace(/&middot;/g,'-').replace(/&amp;/g,'&');
  return `<div class="blk${b.origin==='frame'?' frame':''}${b.origin==='anchor'?' anchor':''}"`
    + ` style="${pos};top:${top}px;height:${h}px;--lines:${lines}${a?`;--ai:var(${a})`:''}"`
    + `${a?' data-area':''} data-tier="${tier}"${b.pin?' data-pinned':''}`
    + `${b.sel?' data-selected':''}${b.prop?' data-proposal':''}`
    + `${b.i>0 && !b.stagger?' data-split':''}`
    + `${b.origin==='anchor' && /Kontron/.test(b.title)?' data-conflict':''}`
    + ` tabindex="0" title="${plain} ${fmt(b.s)}-${fmt(b.e)}"><span class="t">${b.title}</span>${g}</div>`;
}

function gridHTML(visibleHours, opts = {}){
  const ppm = px('--grid-h') / (visibleHours * 60);
  const canvasH = (AXIS_END - AXIS_START) * ppm;
  let axis = '';
  for(let m = AXIS_START; m <= AXIS_END; m += 60)
    axis += `<span class="hh" style="top:${(m-AXIS_START)*ppm}px">${fmt(m)}</span>`;
  let lines = '';
  for(let m = AXIS_START; m <= AXIS_END; m += parseInt(raw('--grid-minor')))
    lines += `<div class="${m % parseInt(raw('--grid-major')) === 0 ? 'maj' : 'min'}"`
           + ` style="top:${(m-AXIS_START)*ppm}px"></div>`;
  const cols = WEEK.map(d => {
    const bs = layout(d.rows);
    const fb = (d.forbid || []).map(([s,e,t]) =>
      `<div class="forbid" style="top:${(min(s)-AXIS_START)*ppm}px;`
      + `height:${(min(e)-min(s))*ppm}px"><span>${t}</span></div>`).join('');
    const now = (opts.now && d.label === opts.now)
      ? `<div class="now" style="top:${(min(opts.nowAt)-AXIS_START)*ppm}px"></div>`
        + `<div class="nowlab" style="top:${(min(opts.nowAt)-AXIS_START)*ppm}px">${opts.nowAt}</div>` : '';
    const drag = (opts.drag && d.label === opts.drag)
      ? `<div class="dragmk" data-at="${opts.dragAt}"`
        + ` style="top:${(min(opts.dragAt)-AXIS_START)*ppm}px"></div>` : '';
    return `<div class="col"><div class="colhead${d.unconf?' unconf':''}">${d.label}`
      + `<i class="n">${bs.length}</i></div><div class="canvas" style="height:${canvasH}px">`
      + lines + fb + now + drag + bs.map(b => blockHTML(b, ppm)).join('') + '</div></div>';
  }).join('');
  return `<div class="gridwrap${opts.drag ? ' dragging' : ''}"><div class="axis"><div class="hd"></div>`
    + `<div style="position:relative;height:${canvasH}px">${axis}</div></div>`
    + `<div class="cols">${cols}</div></div>`;
}

/* Deviation bars are COBALT ONLY. Actual against target per Area, signed off a zero rule.
   Area ink encodes identity; cobalt encodes magnitude and direction. */
const BUDGET = [
  ['Career','--area-01', 27.3, 30, 14.2],
  ['Study','--area-05', 18.4, 20, 9.6],
  ['Fitness','--area-08', 8.6, 12, 4.5],
  ['Admin','--area-07', 3.6, 5, 1.9],
  ['Research','--area-10', 3.8, 8, 2.0],
  ['Projects','--area-03', 2.9, 10, 1.5],
  ['Unallocated', null, 35.3, 15, 18.4]
];
function devRows(){
  const span = 12; /* percentage points either side of the zero rule */
  return BUDGET.map(([name, tok, actual, target, hours]) => {
    const d = actual - target;
    const w = Math.min(50, Math.abs(d) / span * 50);
    const side = d < 0 ? `right:50%;width:${w}%` : `left:50%;width:${w}%`;
    /* No chip. See the .dev comment: a chart row carries no Area ink at all. */
    return `<div class="dev"><span>${name}</span>`
      + `<span class="devtrack"><span class="devfill" style="${side}"></span></span>`
      + `<span class="v">${d > 0 ? '+' : '\u2212'}${Math.abs(d).toFixed(1)}pp</span></div>`;
  }).join('');
}

/* A pie for composition, drawn in SVG so each wedge can carry its own hatch pattern.
   Labels sit OUTSIDE the wedges: a wedge fill only has to clear 3:1 as an indicator, and
   text on it would need 4.5:1. */
function pieHTML(size = 168){
  const r = size/2 - 1, cx = size/2, cy = size/2;
  let acc = -90, defs = '', paths = '';
  BUDGET.forEach(([name, tok, actual]) => {
    const ang = actual / 100 * 360;
    const a0 = acc * Math.PI/180, a1 = (acc+ang) * Math.PI/180;
    const large = ang > 180 ? 1 : 0;
    const id = 'h-' + name.toLowerCase();
    const ink = tok ? `var(${tok})` : 'var(--rule-strong)';
    const light = tok ? `color-mix(in srgb, var(${tok}) var(--hatch-mix), var(--paper-raised))` : 'var(--rule)';
    defs += `<pattern id="${id}" patternUnits="userSpaceOnUse" width="5" height="5">`
      + `<rect width="5" height="5" fill="${ink}"/>`
      + `<path d="M0 5 L5 0 M-1 1 L1 -1 M4 6 L6 4" stroke="${light}" stroke-width="1"/></pattern>`;
    paths += `<path d="M${cx} ${cy} L${cx + r*Math.cos(a0)} ${cy + r*Math.sin(a0)}`
      + ` A${r} ${r} 0 ${large} 1 ${cx + r*Math.cos(a1)} ${cy + r*Math.sin(a1)} Z"`
      + ` fill="url(#${id})" stroke="var(--paper-raised)" stroke-width="1"/>`;
    acc += ang;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"`
    + ` aria-label="Composition of discretionary time by Area"><defs>${defs}</defs>${paths}</svg>`;
}
const LEGEND = BUDGET.map(([name, tok, actual]) =>
  `<span class="areaname">`
  + `<span class="chip" style="--ai:var(${tok || '--rule-strong'})"></span>`
  + `${name} <span class="mut n">${actual.toFixed(1)}%</span></span>`).join('');

        The axis always expands to contain every block in the visible week. Day bounds set

    <div class="panel"><header>Time zone</header><div class="in">

  </div>
</div></div>`;

/* ============================================================================
   Router. The doc bar is a view switcher, not app chrome.
   ============================================================================ */
const NAV_FOR = {'v-first':null, 'v-week':'week', 'v-session':'week', 'v-conflict':'week',
  'v-today':'today', 'v-confirm':'today', 'v-backlog':'backlog', 'v-areas':'areas',
  'v-pie':'areas', 'v-templates':'templates', 'v-learned':'learned',
  'v-settings':'settings', 'v-overlays':'week'};

function show(id){
  document.getElementById('nav').innerHTML = NAV.map(([k, l, c]) =>
    `<a href="#"${NAV_FOR[id] === k ? ' aria-current="page"' : ''}>${ic(k)}${l}`
    + (c ? `<b class="c n">${c}</b>` : '') + '</a>').join('');
  document.getElementById('main').innerHTML = `<section class="view on">${V[id]()}</section>`;
  for(const b of document.querySelectorAll('.doc button'))
    b.toggleAttribute('aria-current', b.dataset.v === id);
  const g = document.querySelector('.gridwrap');
  if(g) g.scrollTop = 7 * 60 * (px('--grid-h') / (12 * 60));
}
for(const b of document.querySelectorAll('.doc button'))
  b.addEventListener('click', () => show(b.dataset.v));
show('v-week');

/* vim-style movement, so every screen is reachable without a mouse */
document.addEventListener('keydown', ev => {
  const el = document.activeElement.closest?.('.blk, .ledrow');
  if(!el) return;
  const sel = el.classList.contains('blk') ? ':scope > .blk' : ':scope > .ledrow';
  const peers = [...el.parentElement.querySelectorAll(sel)];
  const i = peers.indexOf(el);
  const go = n => { ev.preventDefault(); peers[Math.max(0, Math.min(peers.length-1, n))].focus(); };
  if(ev.key === 'ArrowDown' || ev.key === 'j') go(i+1);
  else if(ev.key === 'ArrowUp' || ev.key === 'k') go(i-1);
  else if(ev.key === 'Enter' || ev.key === ' '){
    ev.preventDefault();
    el.closest('.gridwrap, .led')?.querySelectorAll('[data-selected]')
      .forEach(p => p.removeAttribute('data-selected'));
    el.setAttribute('data-selected','');
  }
  else if(ev.key === 'p'){ ev.preventDefault(); el.toggleAttribute('data-pinned'); }
});
</script>
