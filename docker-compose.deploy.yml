# =============================================================================
# syncr production overrides. Layered ON TOP of docker-compose.yml and NEVER valid
# standalone: this file carries overrides only.
#
# The whole file does ONE thing: it repins every image by DIGEST. A floating tag makes
# a redeploy an unreviewed change, and it makes a rollback impossible to state, since
# there is no name for the version that worked.
#
# Memory limits, restart policies and the network topology are deliberately NOT here.
# They live in the base file, so a limit that production depends on is a limit
# development has watched work. See that file's header.
#
# TWO KINDS OF PIN, and the difference is which side creates the digest.
#
#   THIRD-PARTY images are pinned LITERALLY below. The digest is knowable now, so it
#   is reviewed here in the tree, and `just digests` reprints the current ones for a
#   deliberate refresh.
#
#   OUR OWN two images are pinned by REQUIRED VARIABLE. Their digests do not exist
#   until `cd.yml` has built and pushed them, so the file that would carry a literal
#   is written by the deploy: `deployments/digests.env`, which `just deploy` reads and
#   which is what a rollback re-reads to redeploy the previous ones.
#
#   The `:?` form is what makes that safe. An unset variable ABORTS compose with the
#   message below rather than resolving to an empty string, so there is no path from
#   "the digest file is missing" to "deploy whatever `latest` points at now".
#
# `docker-compose.tunnel.yml` is the other half of a production stack and is a
# separate file, because the tunnel is the only ingress and its credential lives
# somewhere else entirely.
# =============================================================================
name: syncr

services:
  api:
    image: ${SYNCR_API_DIGEST:?set SYNCR_API_DIGEST from deployments/digests.env; a deploy never floats a tag}

  worker:
    # The same image as `api`, and therefore the same digest: two entrypoints, one
    # build. Pinning them separately would allow a stack whose api and worker are
    # different commits.
    image: ${SYNCR_API_DIGEST:?set SYNCR_API_DIGEST from deployments/digests.env; a deploy never floats a tag}

  frontend:
    # Frontend and backend deploy together, so this variable is written by the same
    # build that writes the api's. A version-skew window would be a problem invented
    # rather than solved.
    image: ${SYNCR_FRONTEND_DIGEST:?set SYNCR_FRONTEND_DIGEST from deployments/digests.env; a deploy never floats a tag}

  learning:
    image: ${SYNCR_LEARNING_DIGEST:?set SYNCR_LEARNING_DIGEST from deployments/digests.env; a deploy never floats a tag}

  ops:
    image: ${SYNCR_OPS_DIGEST:?set SYNCR_OPS_DIGEST from deployments/digests.env; a deploy never floats a tag}

  fingerprint:
    # The api image again: the reading a restore is checked against is taken by the
    # application, because the rotation cursor is a domain projection.
    image: ${SYNCR_API_DIGEST:?set SYNCR_API_DIGEST from deployments/digests.env; a deploy never floats a tag}

  # --- Third-party images, pinned literally -----------------------------------
  #
  # Each digest was read with `docker buildx imagetools inspect <tag>` and is reviewed
  # together with the tag beside it. A base-image refresh is a deliberate change to
  # this file, not a rebuild side effect.

  postgres:
    # postgres:16.10-bookworm
    image: postgres@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74

  prometheus:
    # prom/prometheus:v3.1.0
    image: prom/prometheus@sha256:6559acbd5d770b15bb3c954629ce190ac3cbbdb2b7f1c30f0385c4e05104e218

  alertmanager:
    # prom/alertmanager:v0.28.0
    image: prom/alertmanager@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8

  grafana:
    # grafana/grafana:11.5.1
    image: grafana/grafana@sha256:5781759b3d27734d4d548fcbaf60b1180dbf4290e708f01f292faa6ae764c5e6

  node_exporter:
    # prom/node-exporter:v1.8.2
    image: prom/node-exporter@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706

  cadvisor:
    # gcr.io/cadvisor/cadvisor:v0.52.1
    image: gcr.io/cadvisor/cadvisor@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435

  postgres_exporter:
    # prometheuscommunity/postgres-exporter:v0.16.0
    image: prometheuscommunity/postgres-exporter@sha256:6999a7657e2f2fb0ca6ebf417213eebf6dc7d21b30708c622f6fcb11183a2bb0
