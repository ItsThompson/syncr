[project]
name = "syncr-cli"
version = "0.1.0"
description = "The syncr CLI: an OAuth client of the same API the browser uses. Separate from syncr-api so it ships nothing server-side."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1",
    "syncr-common",
]

[tool.uv.sources]
syncr-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncr_cli"]

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PT018"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
files = ["src/syncr_cli", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
